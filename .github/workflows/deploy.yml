name: Deploy site

on:
  push:
    branches: [main]
  # Pull requests are built (to catch broken data or templates) but not deployed.
  pull_request:
  # Every hour: picks up new extension releases, and deploys only when the
  # generated pages changed.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Least privilege: the build (which also runs for pull requests) can only
# read; only the deploy job, never run for pull requests, can publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Compare with the deployed site
        id: compare
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          changed=false
          for page in "" "fr/"; do
            if ! curl -sf "${SITE_URL%/}/${page}" -o deployed.html || ! cmp -s deployed.html "dist/${page}index.html"; then
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Pages changed since the last deployment: $changed"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'schedule' || steps.compare.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || needs.build.outputs.changed == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
